line-length = 160
target-version = "py39"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E402",   # module level import not at top of file (Ansible module pattern)
    "B904",   # raise from within except (middleware re-raises intentionally)
    "UP031",  # printf-style string formatting (existing codebase style)
    "SIM105", # use contextlib.suppress (too opinionated for this codebase)
    "SIM108", # use ternary instead of if-else (less readable in module code)
    "SIM102", # collapsible-if (readability preference)
    "SIM401", # use dict.get instead of if-else (readability preference)
    "SIM112", # use upper-case env vars (not always applicable)
    "UP001",  # useless __metaclass__ (existing Ansible boilerplate)
    "UP009",  # utf-8 encoding declaration (existing Ansible boilerplate)
    "UP008",  # super() call with parameters (existing codebase style)
    "UP015",  # redundant open modes (existing codebase style)
    "RUF059", # unused unpacked variable (intentional in module code)
    "I001",   # unsorted imports (existing codebase; enforce on new code via PR review)
    "B007",   # unused loop control variable (intentional in some iteration patterns)
]

exclude = [
    "docs",
    "venv-docs",
    "changelogs",
]

[lint.per-file-ignores]
# Existing code issues to fix incrementally
"plugins/module_utils/midclt.py" = ["B006", "B026"]
"plugins/modules/certificate_authority.py" = ["F841"]
"plugins/modules/filesystem.py" = ["F821", "E712"]
"plugins/modules/nfs.py" = ["F841"]

[lint.isort]
known-third-party = ["ansible", "ansible_collections"]
