---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint flake8 ansible-core ansible-lint

      - name: YAML Lint
        run: yamllint .

      - name: Flake8
        run: flake8 plugins/

      - name: Ansible Lint
        run: ansible-lint

  sanity:
    name: Sanity (Ansible ${{ matrix.ansible }} / Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: "2.15"
            python: "3.10"
          - ansible: "2.16"
            python: "3.11"
          - ansible: "2.17"
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/arensb/truenas

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ansible ${{ matrix.ansible }}
        run: pip install "ansible-core~=${{ matrix.ansible }}.0"

      - name: Run sanity tests
        run: ansible-test sanity --docker -v --color --python ${{ matrix.python }}
        working-directory: ansible_collections/arensb/truenas

  unit:
    name: Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/arensb/truenas

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core pytest pytest-cov packaging

      - name: Run unit tests
        run: >-
          python -m pytest
          tests/unit/
          -v
          --cov=plugins/
          --cov-report=term-missing
        working-directory: ansible_collections/arensb/truenas

  build:
    name: Build Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build collection tarball
        run: ansible-galaxy collection build --force

      - name: Verify tarball was created
        run: ls -la arensb-truenas-*.tar.gz
